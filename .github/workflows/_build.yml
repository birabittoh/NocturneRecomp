name: Build nocturnerecomp

on:
  workflow_call:
    inputs:
      publish_mode:
        description: "'artifact' for CI workflow-artifact, 'release' for GitHub release"
        required: true
        type: string
      artifact_name:
        description: "Artifact name prefix when publish_mode is 'artifact'"
        required: false
        type: string
        default: ""
      tag:
        description: "Release tag to embed in release artifact filenames"
        required: false
        type: string
        default: ""

env:
  ASSETS_REPO: ${{ vars.ASSETS_REPO }}
  ASSET_PATH: default.xex
  ASSET_CACHE_KEY: codegen-assets-v2

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # `platform` names both the SDK to download and the release asset, so
      # it has to match ModState::HostPlatformId() for the auto-updater.
      matrix:
        platform:
          - win-amd64
          - linux-amd64
          - linux-arm64
        include:
          - platform: win-amd64
            runner: windows-latest

          - platform: linux-amd64
            runner: ubuntu-latest

          - platform: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags: CMakeLists.txt derives NOCTURNE_VERSION from
          # `git describe --tags`, and a shallow checkout has no tags, so the
          # build would stamp 0.0.0 and reject mods that declare a
          # `game_version` requirement.
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'linux-')
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y \
            ninja-build libgtk-3-dev libx11-xcb-dev libxss-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install LLVM, CMake, Ninja (Windows)
        if: matrix.platform == 'win-amd64'
        run: choco install llvm cmake ninja -y

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ matrix.platform }}

      - name: Cache XEX asset for codegen
        id: asset-cache
        uses: actions/cache@v5
        with:
          path: |
            assets/${{ env.ASSET_PATH }}
            assets/MEDIA
          key: ${{ env.ASSET_CACHE_KEY }}

      - name: Fetch XEX asset
        if: steps.asset-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        shell: bash
        run: |
          mkdir -p assets
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${{ env.ASSETS_REPO }}/contents/${{ env.ASSET_PATH }}" \
            > "assets/${{ env.ASSET_PATH }}"
          size=$(wc -c < "assets/${{ env.ASSET_PATH }}")
          echo "Fetched ${{ env.ASSET_PATH }} ($size bytes)"
          [ "$size" -ge 1048576 ] || { echo "Asset too small — fetch likely failed"; exit 1; }

          # Shader containers that gen-guest-shaders.py translates.
          mkdir -p assets/MEDIA
          for f in $(gh api "repos/${{ env.ASSETS_REPO }}/contents/MEDIA" --jq '.[].name'); do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${{ env.ASSETS_REPO }}/contents/MEDIA/$f" > "assets/MEDIA/$f"
          done
          ls assets/MEDIA/*.xvu assets/MEDIA/*.xpu

      - name: Download SDK
        shell: bash
        run: python scripts/download-sdk.py "sdk/${{ matrix.platform }}" --pinned

      - name: Build
        shell: bash
        run: python scripts/build.py --release --sdk-dir sdk/${{ matrix.platform }}

      - name: Package
        shell: bash
        run: |
          if [ "${{ inputs.publish_mode }}" = "artifact" ]; then
            out="${{ inputs.artifact_name }}-${{ matrix.platform }}"
          else
            out="nocturnerecomp-${{ inputs.tag }}-${{ matrix.platform }}"
          fi
          python scripts/build.py --package "${out}"

      - name: Upload CI artifact
        if: inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.platform }}
          path: pkg/
          if-no-files-found: error

      - name: Upload release artifact
        if: inputs.publish_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
