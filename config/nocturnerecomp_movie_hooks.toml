# The JP release's story movies, included by nocturnerecomp_manifest.toml.
# See src/jp/movie_player.cpp.

# Title dispatcher sub_822521C0, mode 5 (`b sub_8224ED70`): OPN_WS before the
# prologue; true returns from the dispatcher while it plays.
[[midasm_hook]]
address = 0x82252390
name = "MovieOpeningHook"
jump_address_on_true = 0x822523A0

# Ending sub_82391F48, state 1 (`bl sub_822ED3E0`): TYK_WS / END_WS; true
# leaves through the epilogue while it plays.
[[midasm_hook]]
address = 0x82391FEC
name = "MovieEndingHook"
jump_address_on_true = 0x82392304
