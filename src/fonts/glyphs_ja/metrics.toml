# Per-glyph metrics for the supplemental Japanese glyphs in this folder.
#
# Every codepoint listed in scripts/gen-glyphs.py's REQUIRED_CODEPOINTS is
# picked up automatically from its "U+XXXX.png"; entries here only override the
# defaults, which are:
#
#   left    = 0                     pixels from the pen to the left of the ink
#   top     = 0                     pixels from the top of the 28px cell
#   advance = png width + left      pen advance
#
# Those defaults are right for full-width CJK drawn flush in a 28x28 cell,
# which covers the kanji and the fullwidth forms. Add an entry only when a
# glyph needs different spacing -- e.g. a narrow mark that should still advance
# a full cell, or art drawn with built-in padding.
#
# Format (one line per codepoint, fields optional):
#   U+53D7 = { left = 0, top = 0, advance = 28 }
#
# Reference points from the stock font, for matching the existing spacing:
#   U+3042 (a, hiragana)  box 18px wide, advance 19
#   U+9B54 (ma, kanji)    box 21px wide, advance 21
#   U+0041 (A, latin)     box 13px wide, advance 14
#
# ---------------------------------------------------------------------------
# Generated by scripts/rasterize-glyphs.py from Noto Sans JP (SIL OFL 1.1),
# named instance "Medium", --size 21 --baseline 23.
# Regenerate with that exact command after replacing the art. The box sizes in
# the comments are what each glyph rasterized to; compare them against the
# stock-font targets in the script header when retuning.
# ---------------------------------------------------------------------------
U+3079 = { left = 0, top = 7, advance = 20 }  # べ box 20x16 -- modelled on へ he, box 19 advance 20
U+30AC = { left = 1, top = 5, advance = 17 }  # ガ box 19x20 -- modelled on カ KA, box 16 advance 17
U+30AE = { left = 1, top = 4, advance = 19 }  # ギ box 19x21 -- modelled on キ KI, box 19 advance 19
U+30D2 = { left = 4, top = 6, advance = 18 }  # ヒ box 15x18 -- modelled on ビ BI, box 17 advance 18
U+53D7 = { left = 0, top = 4, advance = 21 }  # 受 box 20x21 -- kanji, stock median advance 21
U+53EF = { left = 0, top = 7, advance = 21 }  # 可 box 20x19 -- kanji, stock median advance 21
U+5E2B = { left = 1, top = 5, advance = 21 }  # 師 box 19x20 -- kanji, stock median advance 21
U+5E38 = { left = 2, top = 5, advance = 21 }  # 常 box 18x20 -- kanji, stock median advance 21
