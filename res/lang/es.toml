# The randomizer presets' descriptions, one line per paragraph (rando_host.cpp).
[rando_presets]
standard = "Complejidad mínima = a elegir\nRandomizer básico.\nNota: la complejidad no es la dificultad, sino la longitud de la cadena de progresión."
og = "Complejidad mínima = 1\nRandomizer básico. Gold Ring, Silver Ring, Holy Glasses y Spikebreaker están en su lugar original. Solo ubicaciones de reliquias.\nEquipo inicial: aleatorio."
guarded_og = "Complejidad mínima = 1\nRandomizer básico. Gold Ring, Silver Ring, Holy Glasses y Spikebreaker están en su lugar original.\nEquipo inicial: aleatorio."
lycanthrope = "Complejidad mínima = 8\nEmpiezas con todas las reliquias del lobo. Menor coste de MP para el lobo.\nEquipo inicial: Shield Rod, Shaman Shield, Silver Crown, Brilliant Mail, Blood Cloak y Mystic Pendant."
nimble = "Complejidad mínima = 6\nEmpiezas con Soul of Bat, Gravity Boots y Leap Stone.\nEquipo inicial: Mana Prism, Buffalo Star, Dragon Helm, Alucard Mail, Twilight Cloak y Duplicator."
warlock = "Complejidad mínima = 6\nEmpiezas con Form of Mist y 99 de INT. Coste de MP de los hechizos muy reducido.\nEquipo inicial: Wizard Hat, el resto aleatorio."
bat_master = "Complejidad mínima = 1\nTodas las habilidades de murciélago mejoradas. El murciélago puede abrir puertas. Y cancela Wing Smash. Manteniendo Y el murciélago vuela a velocidad normal.\nEquipo inicial: aleatorio.\nDiseñado por: MT_Fun & MottZilla"
legday = "Complejidad mínima = 7\nSaltos infinitos con Leap Stone. Súper paso atrás.\n¡VERSIÓN BETA! ¡Comportamiento de las puertas incompleto!\nEquipo inicial: aleatorio.\nDiseñado por: MT_Fun & MottZilla"
bounty_hunter = "Complejidad mínima = 5\nLas 5 reliquias de Vlad las sueltan 5 enemigos elegidos al azar. Encuentra las 5 cartas de familiar para saber a qué 5 enemigos derrotar para conseguir cada reliquia de Vlad.\nEquipo inicial: Alucart Sword, Shield, Mail, Dragon Helm, Twilight Cloak, Ring of Arcana"
hitman = "Complejidad mínima = 1\nCasi igual que Bounty Hunter, pero empiezas con las 5 cartas y aumenta la probabilidad de que suelten las reliquias de Vlad. Al generar estas semillas también verás los nombres de los 5 objetivos.\nEquipo inicial: Alucart Sword, Shield, Mail, Dragon Helm, Twilight Cloak, Ring of Arcana"
richter_rando = "Complejidad mínima = a elegir. 6 por defecto y máximo.\nJuega el randomizer con Richter. Para llegar al final necesitas Holy Glasses y las 5 reliquias de Vlad. Richter puede usar algunas reliquias para avanzar o mejorar, además de comida, Library Cards y Life Apples.\nConsejos rápidos:\nTeletransporte de Library Card con Faerie Scroll o Library Card:\nmantén LB+RB y pulsa B.\nComida: mantén arriba y pulsa RT.\nMás información en READTHIS.TXT de SOTN_XB_RANDO."
adventure = "Complejidad mínima = a elegir. 8 por defecto.\nRandomizer normal con ubicaciones de equipo. Se tarda más en completar.\nEquipo inicial: aleatorio."
expedition = "Complejidad mínima = 7\nEmpiezas con Soul of Bat, Gravity Boots y Leap Stone.\nEquipo inicial: Mana Prism, Buffalo Star, Dragon Helm, Alucard Mail, Twilight Cloak y Duplicator.\n¡Con ubicaciones de equipo!"
glitch = "Complejidad mínima = 5\nEste preset requiere varios glitches para completarse, como Shift Lines, Reverse Shift Lines, saltos con Fire Boomerang y más. La lógica es parecida a la del preset Glitch del randomizer de PSX actual.\nEquipo inicial: aleatorio + Fire Boomerang y Library Card.\n¡Con ubicaciones de equipo!"
