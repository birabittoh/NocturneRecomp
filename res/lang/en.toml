# The randomizer presets' descriptions, one line per paragraph (rando_host.cpp).
[rando_presets]
standard = "Minimum Complexity = User Choice\nBasic Randomizer.\nNote: Complexity is not difficulty. It's progression chain length."
og = "Minimum Complexity = 1\nBasic Randomizer. Gold & Silver Rings, Holy Glasses, and Spikebreaker are in original locations. Relic locations only.\nStarting Gear: Random."
guarded_og = "Minimum Complexity = 1\nBasic Randomizer. Gold & Silver Rings, Holy Glasses, and Spikebreaker are in original locations.\nStarting Gear: Random."
lycanthrope = "Minimum Complexity = 8\nStart with all Wolf Relics. Reduced MP cost for Wolf.\nStarting Gear: Shield Rod, Shaman Shield, Silver Crown, Brilliant Mail, Blood Cloak, and Mystic Pendant."
nimble = "Minimum Complexity = 6\nStart with Soul of Bat, Gravity Boots, and Leap Stone.\nStarting Gear: Mana Prism, Buffalo Star, Dragon Helm, Alucard Mail, Twilight Cloak, and Duplicator."
warlock = "Minimum Complexity = 6\nStart with Form of Mist and 99 INT. Spell MP cost greatly reduced.\nStarting Gear: Wizard Hat, the rest random."
bat_master = "Minimum Complexity = 1\nAll Bat Abilities upgraded. Bat form can open doors. Pressing Y Cancels Wing Smash. Holding Y moves bat at normal speed.\nStarting Gear: Random.\nDesigned by: MT_Fun & MottZilla"
legday = "Minimum Complexity = 7\nInfinite Leap Stone jumping. Super Backdash.\nBETA VERSION! Door behavior incomplete!\nStarting Gear: Random.\nDesigned by: MT_Fun & MottZilla"
bounty_hunter = "Minimum Complexity = 5\nThe 5 Vlad relics are dropped from 5 randomly picked enemies. You must find the 5 Familiar Cards to find out which 5 enemies you need to defeat to get each Vlad relic.\nStarting Gear: Alucart Sword, Shield, Mail, Dragon Helm, Twilight Cloak, Ring of Arcana"
hitman = "Minimum Complexity = 1\nThis is mostly the same as Bounty Hunter except you start with all 5 cards and the drop rate on the Vlad relics is increased. When generating these seeds you will see the names of the 5 targets as well.\nStarting Gear: Alucart Sword, Shield, Mail, Dragon Helm, Twilight Cloak, Ring of Arcana"
richter_rando = "Minimum Complexity = User Choice. 6 Default & Max.\nPlay randomizer as Richter. You must find Holy Glasses and all 5 Vlads to reach the end. Richter can make use of certain relics to progress or power up. He can also use Food, Library Cards, and Life Apples.\nQuick Tips:\nLibrary Card Teleport with Faerie Scroll or Library Card.\nHold LB+RB and Press B.\nUse Food by holding Up and Pressing RT.\nSee READTHIS.TXT in SOTN_XB_RANDO for more info."
adventure = "Minimum Complexity = User Choice. 8 Default.\nNormal Randomizer with Equipment Location checks. Takes longer to complete.\nStarting Gear: Random."
expedition = "Minimum Complexity = 7\nStart with Soul of Bat, Gravity Boots, and Leap Stone.\nStarting Gear: Mana Prism, Buffalo Star, Dragon Helm, Alucard Mail, Twilight Cloak, and Duplicator.\nEquipment Location checks!"
glitch = "Minimum Complexity = 5\nThis preset requires the use of different Glitches to complete. This includes Shift Lines, Reverse Shift Lines, Fire Boomerang Jumps, and more. The logic is similar to the current PSX randomizer's Glitch preset.\nStarting Gear: Random + Fire Boomerang & Library Card.\nEquipment Location checks!"
nologic = "Minimum Complexity = 1\nAnother glitch preset. In this preset you start with Soul of Wolf, Leap Stone, Fire Boomerangs, Axe Lord Armor, Duplicator, Manna Prism, Shield Rod, and Shaman Shield. Relics can be anywhere as there is no location logic.\nGuarded Location checks!"
nologiceq = "Minimum Complexity = 1\nAnother glitch preset. In this preset you start with Soul of Wolf, Leap Stone, Fire Boomerangs, Axe Lord Armor, Duplicator, Manna Prism, Shield Rod, and Shaman Shield. Relics can be anywhere as there is no location logic.\nEquipment Location checks!"
bingo = "Vanilla Relics, start with Holy Glasses, no random Library Card or Duplicator drops from enemies. Be aware all check box options other than Randomize Relics still work for Bingo.\nFor Bingo Board Play Only."
