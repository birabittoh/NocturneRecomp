# The randomizer presets' descriptions, one line per paragraph (rando_host.cpp).
[rando_presets]
standard = "Mindestkomplexität = frei wählbar\nEinfacher Randomizer.\nHinweis: Komplexität ist nicht Schwierigkeit, sondern die Länge der Fortschrittskette."
og = "Mindestkomplexität = 1\nEinfacher Randomizer. Gold Ring, Silver Ring, Holy Glasses und Spikebreaker liegen an ihren Originalorten. Nur Relikt-Fundorte.\nStartausrüstung: zufällig."
guarded_og = "Mindestkomplexität = 1\nEinfacher Randomizer. Gold Ring, Silver Ring, Holy Glasses und Spikebreaker liegen an ihren Originalorten.\nStartausrüstung: zufällig."
lycanthrope = "Mindestkomplexität = 8\nStart mit allen Wolf-Relikten. Geringere MP-Kosten für den Wolf.\nStartausrüstung: Shield Rod, Shaman Shield, Silver Crown, Brilliant Mail, Blood Cloak und Mystic Pendant."
nimble = "Mindestkomplexität = 6\nStart mit Soul of Bat, Gravity Boots und Leap Stone.\nStartausrüstung: Mana Prism, Buffalo Star, Dragon Helm, Alucard Mail, Twilight Cloak und Duplicator."
warlock = "Mindestkomplexität = 6\nStart mit Form of Mist und 99 INT. Stark reduzierte MP-Kosten für Zauber.\nStartausrüstung: Wizard Hat, der Rest zufällig."
bat_master = "Mindestkomplexität = 1\nAlle Fledermaus-Fähigkeiten verbessert. Als Fledermaus lassen sich Türen öffnen. Y bricht Wing Smash ab. Mit gehaltenem Y fliegt die Fledermaus normal schnell.\nStartausrüstung: zufällig.\nEntworfen von: MT_Fun & MottZilla"
legday = "Mindestkomplexität = 7\nUnendliche Leap-Stone-Sprünge. Super-Rückwärtssprung.\nBETA-VERSION! Türverhalten unvollständig!\nStartausrüstung: zufällig.\nEntworfen von: MT_Fun & MottZilla"
bounty_hunter = "Mindestkomplexität = 5\nDie 5 Vlad-Relikte lassen 5 zufällig gewählte Gegner fallen. Finde die 5 Familiar-Karten, um zu erfahren, welche 5 Gegner du für jedes Vlad-Relikt besiegen musst.\nStartausrüstung: Alucart Sword, Shield, Mail, Dragon Helm, Twilight Cloak, Ring of Arcana"
hitman = "Mindestkomplexität = 1\nWeitgehend wie Bounty Hunter, aber du startest mit allen 5 Karten und die Droprate der Vlad-Relikte ist erhöht. Beim Erzeugen dieser Seeds siehst du auch die Namen der 5 Ziele.\nStartausrüstung: Alucart Sword, Shield, Mail, Dragon Helm, Twilight Cloak, Ring of Arcana"
richter_rando = "Mindestkomplexität = frei wählbar. 6 Standard und Maximum.\nSpiele den Randomizer als Richter. Für das Ende brauchst du Holy Glasses und alle 5 Vlad-Relikte. Richter kann bestimmte Relikte zum Weiterkommen oder Verstärken nutzen, dazu Essen, Library Cards und Life Apples.\nKurztipps:\nLibrary-Card-Teleport mit Faerie Scroll oder Library Card:\nLB+RB halten und B drücken.\nEssen: oben halten und RT drücken.\nMehr in READTHIS.TXT in SOTN_XB_RANDO."
adventure = "Mindestkomplexität = frei wählbar. 8 Standard.\nNormaler Randomizer mit Ausrüstungs-Fundorten. Dauert länger.\nStartausrüstung: zufällig."
expedition = "Mindestkomplexität = 7\nStart mit Soul of Bat, Gravity Boots und Leap Stone.\nStartausrüstung: Mana Prism, Buffalo Star, Dragon Helm, Alucard Mail, Twilight Cloak und Duplicator.\nMit Ausrüstungs-Fundorten!"
glitch = "Mindestkomplexität = 5\nDieses Preset erfordert verschiedene Glitches, darunter Shift Lines, Reverse Shift Lines, Fire-Boomerang-Sprünge und mehr. Die Logik ähnelt dem Glitch-Preset des aktuellen PSX-Randomizers.\nStartausrüstung: zufällig + Fire Boomerang und Library Card.\nMit Ausrüstungs-Fundorten!"
nologic = "Mindestkomplexität = 1\nEin weiteres Glitch-Preset. Du startest mit Soul of Wolf, Leap Stone, Fire Boomerangs, Axe Lord Armor, Duplicator, Manna Prism, Shield Rod und Shaman Shield. Relikte können überall liegen, es gibt keine Fundort-Logik.\nMit bewachten Fundorten!"
nologiceq = "Mindestkomplexität = 1\nEin weiteres Glitch-Preset. Du startest mit Soul of Wolf, Leap Stone, Fire Boomerangs, Axe Lord Armor, Duplicator, Manna Prism, Shield Rod und Shaman Shield. Relikte können überall liegen, es gibt keine Fundort-Logik.\nMit Ausrüstungs-Fundorten!"
bingo = "Originale Relikte, Start mit Holy Glasses, keine zufälligen Library-Card- oder Duplicator-Drops von Gegnern. Alle Optionen außer Relikte gelten auch für Bingo.\nNur für das Spielen mit einer Bingo-Karte."
