# The randomizer presets' descriptions, one line per paragraph (rando_host.cpp).
[rando_presets]
standard = "最低難度 = 自由に選択\n基本のランダマイザー。\n注: 難度は難しさではなく、進行に必要な手順の長さです。"
og = "最低難度 = 1\n基本のランダマイザー。Gold Ring、Silver Ring、Holy Glasses、Spikebreakerは元の場所にあります。レリックの場所のみ。\n初期アイテム: ランダム。"
guarded_og = "最低難度 = 1\n基本のランダマイザー。Gold Ring、Silver Ring、Holy Glasses、Spikebreakerは元の場所にあります。\n初期アイテム: ランダム。"
lycanthrope = "最低難度 = 8\n狼のレリックをすべて持って開始。狼のMP消費が減少。\n初期アイテム: Shield Rod、Shaman Shield、Silver Crown、Brilliant Mail、Blood Cloak、Mystic Pendant。"
nimble = "最低難度 = 6\nSoul of Bat、Gravity Boots、Leap Stoneを持って開始。\n初期アイテム: Mana Prism、Buffalo Star、Dragon Helm、Alucard Mail、Twilight Cloak、Duplicator。"
warlock = "最低難度 = 6\nForm of MistとINT 99で開始。魔法のMP消費が大きく減少。\n初期アイテム: Wizard Hat、残りはランダム。"
bat_master = "最低難度 = 1\nコウモリの能力がすべて強化。コウモリで扉を開けられます。YでWing Smashを中断。Yを押し続けると通常の速さで飛びます。\n初期アイテム: ランダム。\nデザイン: MT_Fun & MottZilla"
legday = "最低難度 = 7\nLeap Stoneで無限にジャンプ。強力なバックダッシュ。\nベータ版! 扉の動作は未完成です!\n初期アイテム: ランダム。\nデザイン: MT_Fun & MottZilla"
bounty_hunter = "最低難度 = 5\nドラキュラの遺物5つは、ランダムに選ばれた5体の敵が落とします。使い魔のカード5枚を見つけて、どの敵を倒せばよいかを調べましょう。\n初期アイテム: Alucart Sword、Shield、Mail、Dragon Helm、Twilight Cloak、Ring of Arcana"
hitman = "最低難度 = 1\nBounty Hunterとほぼ同じですが、カード5枚を持って開始し、ドラキュラの遺物を落とす確率が上がります。シード作成時に5体の標的の名前も表示されます。\n初期アイテム: Alucart Sword、Shield、Mail、Dragon Helm、Twilight Cloak、Ring of Arcana"
richter_rando = "最低難度 = 自由に選択。初期値・最大は6。\nリヒターでランダマイザーをプレイ。最後に行くにはHoly Glassesとドラキュラの遺物5つが必要です。リヒターは一部のレリックで進んだり強くなったりでき、食べ物、Library Card、Life Appleも使えます。\nヒント:\nFaerie ScrollかLibrary CardでLibrary Cardのワープ:\nLB+RBを押したままBを押す。\n食べ物は上を押したままRTで使います。\n詳しくはSOTN_XB_RANDOのREADTHIS.TXTを見てください。"
adventure = "最低難度 = 自由に選択。初期値は8。\n武器防具の場所も含む通常のランダマイザー。クリアに時間がかかります。\n初期アイテム: ランダム。"
expedition = "最低難度 = 7\nSoul of Bat、Gravity Boots、Leap Stoneを持って開始。\n初期アイテム: Mana Prism、Buffalo Star、Dragon Helm、Alucard Mail、Twilight Cloak、Duplicator。\n武器防具の場所も含みます!"
glitch = "最低難度 = 5\nクリアにはさまざまなグリッチが必要です。Shift Line、Reverse Shift Line、Fire Boomerangジャンプなどを含みます。ロジックは現在のPSX版ランダマイザーのGlitchプリセットに近いものです。\n初期アイテム: ランダム + Fire Boomerang、Library Card。\n武器防具の場所も含みます!"
nologic = "最低難度 = 1\nもう1つのグリッチ用プリセット。Soul of Wolf、Leap Stone、Fire Boomerang、Axe Lord Armor、Duplicator、Manna Prism、Shield Rod、Shaman Shieldを持って開始。場所のロジックがないので、レリックはどこにでもあり得ます。\n守られた場所も含みます!"
nologiceq = "最低難度 = 1\nもう1つのグリッチ用プリセット。Soul of Wolf、Leap Stone、Fire Boomerang、Axe Lord Armor、Duplicator、Manna Prism、Shield Rod、Shaman Shieldを持って開始。場所のロジックがないので、レリックはどこにでもあり得ます。\n武器防具の場所も含みます!"
bingo = "レリックは元のまま、Holy Glassesを持って開始、敵がLibrary CardやDuplicatorをランダムに落とすことはありません。レリック以外のオプションはビンゴでも有効です。\nビンゴカードでのプレイ専用。"
